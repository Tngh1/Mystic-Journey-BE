name: CI and Deploy Mystic Journey Backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Mystic-Journey-BE.sln

      - name: Build
        run: dotnet build Mystic-Journey-BE.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Mystic-Journey-BE.Tests/Mystic-Journey-BE.Tests.csproj --configuration Release --no-build --no-restore

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu

            cd /opt/mystic-journey

            echo "==> Fetch tested commit"
            git fetch origin main
            git reset --hard "${{ github.sha }}"

            test -f .env || {
              echo "Missing /opt/mystic-journey/.env"
              exit 1
            }

            echo "==> Build images"
            docker compose build --pull

            echo "==> Start PostgreSQL"
            docker compose up -d postgres

            for attempt in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' mystic-journey-postgres 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              if [ "$attempt" -eq 24 ]; then
                docker compose logs --tail=100 postgres
                exit 1
              fi
              sleep 5
            done

            echo "==> Apply EF Core migrations"
            docker compose run --rm migrate

            echo "==> Start API"
            docker compose up -d --no-deps api

            for attempt in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' mystic-journey-api 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              if [ "$attempt" -eq 24 ]; then
                docker compose ps
                docker compose logs --tail=150 api
                exit 1
              fi
              sleep 5
            done

            docker compose ps
            docker image prune --force
            echo "Deployment completed successfully"
