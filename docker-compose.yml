# Docker Compose for Mystic Journey Backend
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystic-journey-api
    ports:
      - "8080:8080"
    env_file:
      - ./Mystic-Journey-API/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped
