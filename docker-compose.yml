services:
  postgres:
    image: postgres:16-alpine
    container_name: mystic-journey-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mystic_journey}
      POSTGRES_USER: ${POSTGRES_USER:-mystic_journey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}

    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"


  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations

    container_name: mystic-journey-migrate

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./.env

    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mystic_journey};Username=${POSTGRES_USER:-mystic_journey};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}"

    restart: "no"


  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        BUILD_CONFIGURATION: Release

    container_name: mystic-journey-api

    depends_on:
      migrate:
        condition: service_completed_successfully

    ports:
      - "${API_PORT:-8080}:8080"

    env_file:
      - ./.env

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mystic_journey};Username=${POSTGRES_USER:-mystic_journey};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}"

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"


volumes:
  postgres_data: